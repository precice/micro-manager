name: Check test coverage

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - "*"

jobs:
  coverage:
    name: Run test coverage check
    runs-on: ubuntu-latest
    container: precice/precice:nightly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: micro-manager

      - name: Install dependencies
        working-directory: micro-manager
        run: |
          apt-get -qq update
          apt-get -qq install python3-dev python3-venv git pkg-config

      - name: Create a virtual environment and install Micro Manager with coverage
        working-directory: micro-manager
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install coverage
          pip install .[sklearn,snapshot]
          pip uninstall -y pyprecice

      - name: Run unit tests with coverage
        working-directory: micro-manager
        run: |
          . .venv/bin/activate
          cd tests/unit
          python3 -m coverage run --source=micro_manager -m unittest discover -s . -p "test_*.py"

      - name: Check coverage threshold
        working-directory: micro-manager
        run: |
          . .venv/bin/activate
          cd tests/unit
          python3 ../../check_coverage.py
