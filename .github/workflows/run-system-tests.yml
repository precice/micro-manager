name: System tests

on:
  pull_request:
    types: [labeled]

jobs:
  run-system-tests:
    if: ${{ github.event.label.name == 'trigger-system-tests' }}
    uses: precice/tutorials/.github/workflows/system-tests.yml@develop
    with:
      suites: micro-manager
      build_args: MICRO_MANAGER_PR:${{ github.event.number }},MICRO_MANAGER_REF:${{ github.event.pull_request.head.sha }}
