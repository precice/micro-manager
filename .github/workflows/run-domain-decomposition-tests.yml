name: Test functions in class DomainDecomposer
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - "*"
jobs:
  unit_tests:
    name: Run domain decomposition unit tests
    runs-on: ubuntu-latest
    container: precice/micro-manager-ci:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: micro-manager

      - name: Create a virtual environment and install the Micro Manager in it
        working-directory: micro-manager
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install .

      - name: Run unit tests
        working-directory: micro-manager
        run: |
          . .venv/bin/activate
          cd tests/unit
          python3 -m unittest test_domain_decomposition.py
